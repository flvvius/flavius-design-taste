<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anonymous design comparison</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;color:#171717;background:#fff;font:16px/1.5 system-ui,sans-serif}h1{font-size:24px;font-weight:600;margin:0 0 12px}p{max-width:75ch}fieldset{display:flex;flex-wrap:wrap;gap:20px;border:1px solid #999;margin:24px 0;padding:16px}label{display:block}select{display:block;font:inherit;min-height:44px;border:1px solid #777;background:white;color:#171717;padding:6px}a{color:inherit;text-underline-offset:4px}:focus-visible{outline:3px solid #222;outline-offset:3px}.samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}h2{font-size:18px;font-weight:500}img{width:100%;height:auto;display:block;border:1px solid #aaa}.hint{font-size:14px;color:#444}@media(max-width:900px){.samples{grid-template-columns:1fr}article{max-width:1280px}}.mobile article{max-width:375px}</style></head><body><h1>Anonymous design comparison</h1><p>Compare the same setting across all samples. Keep the condition key closed until scoring. <a href="scoring-sheet.md">Scoring sheet</a> · <a href="results.json">Measured gates</a></p><p class="hint">Open each image for its full resolution. Gate results and preference ratings stay separate. The source pages are frozen.</p><fieldset><legend>Comparison settings</legend><label>Page<select id="page"><option value="screen">Sample queue</option><option value="hero">Public landing hero</option></select></label><label>Viewport<select id="width"><option value="375">375px</option><option value="1280" selected>1280px</option></select></label><label>Theme<select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Text<select id="text"><option value="">Normal</option><option value="-text200">200% rendered fonts</option></select></label></fieldset><main class="samples" id="samples"></main><script>const ids=["FFF6", "1FE9", "3BBD"];const controls=['page','width','theme','text'].map(id=>document.getElementById(id));function render(){const [page,width,theme,text]=controls.map(n=>n.value);document.querySelector('main').classList.toggle('mobile',width==='375');document.getElementById('samples').replaceChildren(...ids.map(id=>{const article=document.createElement('article'),title=document.createElement('h2'),link=document.createElement('a'),image=document.createElement('img'),source=document.createElement('a');title.textContent='Sample '+id;link.href=`samples/${id}/${page}${text}-${width}-${theme}.png`;image.src=link.href;image.alt=`Sample ${id}, ${page}, ${width}px, ${theme}, ${text?'200% text':'normal text'}`;link.append(image);source.href=`samples/${id}/${page}.html`;source.textContent='Open frozen page';article.append(title,link,source);return article}));}controls.forEach(n=>n.addEventListener('change',render));render();</script></body></html>
