<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document library</title>
<link rel="stylesheet" href="../../../skills/editorial-calm/assets/tokens.css">
<link rel="stylesheet" href="../../../skills/editorial-calm/assets/fonts.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:var(--type-weightBody) var(--type-bodyWeb)/var(--type-lineHeight) Inter,system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}select{max-width:100%}button,select{border:1px solid var(--input);border-radius:var(--radius-control);background:var(--background);padding:6px 12px;min-height:36px;cursor:pointer}button:hover{background:var(--accent)}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
header{border-bottom:1px solid var(--border);padding:16px 32px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center}.brand{flex:1 1 0;font-weight:var(--type-weightTitle)}.quiet{color:var(--muted-foreground)}main{max-width:1160px;margin:40px auto;padding:0 32px}h1{font-size:var(--type-pageTitle);font-weight:var(--type-weightTitle);letter-spacing:-.035em;margin:0;overflow-wrap:anywhere}p{margin:8px 0 24px;max-width:var(--type-descriptionMeasure)}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:24px 0 12px}.toolbar label{font-weight:var(--type-weightLabel)}.selection{margin-inline-start:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}.primary:hover{background:var(--primary);opacity:.9}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}caption{text-align:start;color:var(--muted-foreground);padding:0 0 12px;font-size:.875rem}th,td{text-align:start;border-bottom:1px solid var(--border);padding:12px 10px;vertical-align:middle}th{font-size:.875rem;font-weight:var(--type-weightLabel);color:var(--muted-foreground);border-top:1px solid var(--border)}th button{border:0;padding:4px 0;border-radius:0;font-size:inherit;color:inherit;text-align:start}th:first-child,td:first-child{width:44px;padding-inline-start:4px}th:nth-child(2){width:43%}td{font-size:.875rem}td .title{font-size:var(--type-section);font-weight:var(--type-weightTitle);overflow-wrap:anywhere}td .format{display:block;color:var(--muted-foreground);font-size:.8125rem}input[type=checkbox]{appearance:none;position:relative;width:44px;height:44px;flex:none;vertical-align:middle;border:0;margin:0;cursor:pointer;background:transparent;display:inline-grid;place-content:center}input[type=checkbox]:before{box-sizing:border-box;content:'';width:18px;height:18px;border:1px solid var(--input);border-radius:3px;background:var(--background)}input:checked:before,input:indeterminate:before{background:var(--primary);border-color:var(--primary)}input:checked:after,input:indeterminate:after{position:absolute;inset:0;display:grid;place-items:center;color:var(--primary-foreground);font-size:14px;line-height:1}input:checked:after{content:'✓'}input:indeterminate:after{content:'−'}tr.selected{background:var(--accent)}tbody tr:hover{background:var(--muted)}.status-ready{color:var(--success)}.status-review{color:var(--warning-text)}.notice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:52px;margin-top:12px}.notice p{margin:0}.empty{text-align:center;padding:32px}.help{font-size:.8125rem;color:var(--muted-foreground);margin-top:16px}.mobile-sort,.mobile-selectall{display:none}.selection-target{display:inline-grid;place-items:center;width:44px;height:44px;cursor:pointer}.mobile-selectall{align-items:center;gap:8px;min-height:44px;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
@media(pointer:coarse){button,select{min-height:44px}input[type=checkbox]:before{width:24px;height:24px}td:first-child{min-width:44px}}
@media(max-width:680px){header{padding:16px}main{margin:24px auto;padding:0 var(--space-gutterWeb)}.selection{margin-inline-start:0;width:100%}.mobile-selectall{display:flex}.mobile-sort{display:flex;align-items:center;gap:8px;flex-wrap:wrap}table,tbody{display:block}thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}tbody tr{display:grid;grid-template-columns:52px minmax(0,1fr);border-top:1px solid var(--border);padding:12px 0}td{border:0;padding:2px 0;grid-column:2}td:first-child{grid-column:1;grid-row:1 / span 4;width:auto;padding:5px 0}td:before{content:attr(data-label);color:var(--muted-foreground);margin-inline-end:8px}td:nth-child(2):before{content:none}caption{display:block}tbody tr:last-child{border-bottom:1px solid var(--border)}td.empty{grid-column:1 / -1;grid-row:auto;text-align:start;padding:24px 0}.help{max-width:40ch}}
</style>
</head>
<body>
<header><span class="brand">Fieldwork / Documents</span><button id="theme" aria-pressed="false">Dark mode</button></header>
<main>
<h1>Document library</h1>
<p class="quiet">Project notes, decisions and working drafts for the autumn release.</p>
<div class="toolbar">
<label for="view">Show documents</label><select id="view"><option value="active">Active</option><option value="archived">Archived</option></select>
<div class="mobile-sort"><label for="sort">Sort by</label><select id="sort"><option value="name">Document</option><option value="owner">Owner</option><option value="date" selected>Updated</option><option value="status">Status</option></select><button id="direction" aria-label="Sort ascending">↓</button></div>
<label class="mobile-selectall"><input id="all-mobile" type="checkbox">Select all visible</label>
<div class="selection"><span id="selected">0 selected</span><button id="bulk" class="primary" disabled>Archive selected</button></div>
</div>
<table aria-label="Documents"><caption id="count"></caption><thead><tr>
<th scope="col"><label class="selection-target"><input type="checkbox" id="all" aria-label="Select all visible documents"></label></th>
<th scope="col" aria-sort="none"><button data-sort="name">Document <span></span></button></th>
<th scope="col" aria-sort="none"><button data-sort="owner">Owner <span></span></button></th>
<th scope="col" aria-sort="descending"><button data-sort="date">Updated <span>↓</span></button></th>
<th scope="col" aria-sort="none"><button data-sort="status">Status <span></span></button></th>
</tr></thead><tbody id="rows"></tbody></table>
<p class="help">Tab to a checkbox and press Space to select. Use ↑ and ↓ to move between document checkboxes.</p>
<div class="notice"><p id="message" role="status" aria-live="polite"></p><button id="undo" hidden>Undo</button></div>
</main>
<script>
const documents=[
{id:1,name:'Autumn release plan',format:'Document · 8 pages',owner:'Mara Ionescu',date:'2026-10-09',status:'Ready'},
{id:2,name:'Customer interview notes',format:'Document · 12 pages',owner:'Alex Chen',date:'2026-10-08',status:'In review'},
{id:3,name:'Search experience specification',format:'Document · 6 pages',owner:'Flavius Cojocaru',date:'2026-10-07',status:'Draft'},
{id:4,name:'Content migration checklist',format:'Document · 3 pages',owner:'Mara Ionescu',date:'2026-10-06',status:'Ready'},
{id:5,name:'Accessibility review',format:'Document · 5 pages',owner:'Sam Rivera',date:'2026-10-05',status:'In review'},
{id:6,name:'Editorial workflow decisions',format:'Document · 4 pages',owner:'Alex Chen',date:'2026-10-03',status:'Ready'},
{id:7,name:'Research synthesis and open questions',format:'Document · 9 pages',owner:'Sam Rivera',date:'2026-10-02',status:'Draft'},
{id:8,name:'September retrospective',format:'Document · 2 pages',owner:'Flavius Cojocaru',date:'2026-09-30',status:'Ready'}
];
const $=id=>document.getElementById(id), selected=new Set();let key='date',ascending=false,lastAction=null;
const visible=()=>documents.filter(d=>Boolean(d.archived)===($('view').value==='archived')).sort((a,b)=>(ascending?1:-1)*(a[key].localeCompare(b[key])||a.id-b.id));
function updateSelection(){const list=visible();$('selected').textContent=`${selected.size} selected`;$('bulk').disabled=!selected.size;$('all').checked=list.length>0&&list.every(d=>selected.has(d.id));$('all').indeterminate=selected.size>0&&!$('all').checked;$('all').disabled=!list.length;$('all-mobile').checked=$('all').checked;$('all-mobile').indeterminate=$('all').indeterminate;$('all-mobile').disabled=$('all').disabled;document.querySelectorAll('[data-id]').forEach(row=>{row.classList.toggle('selected',selected.has(Number(row.dataset.id)));row.querySelector('input').checked=selected.has(Number(row.dataset.id));});}
function render(){
const list=visible();$('rows').replaceChildren();$('count').textContent=`${list.length} ${$('view').value} document${list.length===1?'':'s'}`;
for(const d of list){const row=document.createElement('tr');row.dataset.id=d.id;const checkCell=document.createElement('td'),check=document.createElement('input');check.type='checkbox';check.setAttribute('aria-label',`Select ${d.name}`);check.addEventListener('change',()=>{check.checked?selected.add(d.id):selected.delete(d.id);updateSelection();});check.addEventListener('keydown',event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();const checks=[...$('rows').querySelectorAll('input')],index=checks.indexOf(check);checks[Math.max(0,Math.min(checks.length-1,index+(event.key==='ArrowDown'?1:-1)))].focus();}});const hit=document.createElement('label');hit.className='selection-target';hit.append(check);checkCell.append(hit);row.append(checkCell);
const title=document.createElement('td'),name=document.createElement('div'),format=document.createElement('span');name.className='title';name.textContent=d.name;format.className='format';format.textContent=d.format;title.append(name,format);row.append(title);
for(const [label,value] of [['Owner',d.owner],['Updated',new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(d.date))],['Status',d.status]]){const cell=document.createElement('td');cell.dataset.label=label;cell.textContent=value;if(label==='Status')cell.className=d.status==='Ready'?'status-ready':d.status==='In review'?'status-review':'';row.append(cell);}$('rows').append(row);}
if(!list.length){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=5;cell.className='empty';cell.textContent=$('view').value==='archived'?'No archived documents.':'No active documents. Restore documents from the archive.';row.append(cell);$('rows').append(row);}
$('bulk').textContent=$('view').value==='active'?'Archive selected':'Restore selected';$('sort').value=key;$('direction').textContent=ascending?'↑':'↓';$('direction').setAttribute('aria-label',ascending?'Sort descending':'Sort ascending');document.querySelectorAll('[data-sort]').forEach(button=>{const active=button.dataset.sort===key;button.parentElement.setAttribute('aria-sort',active?(ascending?'ascending':'descending'):'none');button.querySelector('span').textContent=active?(ascending?'↑':'↓'):'';});updateSelection();}
function sortBy(next){if(key===next)ascending=!ascending;else{key=next;ascending=next!=='date';}render();}
document.querySelectorAll('[data-sort]').forEach(button=>button.addEventListener('click',()=>sortBy(button.dataset.sort)));
$('sort').addEventListener('change',()=>sortBy($('sort').value));$('direction').addEventListener('click',()=>{ascending=!ascending;render();});
for(const id of ['all','all-mobile'])$(id).addEventListener('change',event=>{visible().forEach(d=>event.target.checked?selected.add(d.id):selected.delete(d.id));updateSelection();});
const narrow=matchMedia('(max-width:680px)');
let mobileFocus=null;
for(const id of ['sort','direction','all-mobile']){
const control=$(id);
control.addEventListener('focus',()=>{mobileFocus=control;});
control.addEventListener('blur',()=>{if(control.getClientRects().length)mobileFocus=null;});
}
function headerFocus(){
const active=document.activeElement, previous=active===document.body?mobileFocus:active;
document.querySelectorAll('thead input,thead button').forEach(el=>el.tabIndex=narrow.matches?-1:0);
let next=null;
if(narrow.matches&&previous?.closest('thead'))next=previous.id==='all'?$('all-mobile'):$('sort');
if(!narrow.matches&&previous?.id==='all-mobile')next=$('all');
if(!narrow.matches&&['sort','direction'].includes(previous?.id))next=document.querySelector(`[data-sort="${key}"]`);
if(next&&!next.disabled)next.focus();
if(!narrow.matches)mobileFocus=null;
}
headerFocus();narrow.addEventListener('change',headerFocus);
$('view').addEventListener('change',()=>{selected.clear();render();});
$('bulk').addEventListener('click',()=>{const archive=$('view').value==='active';lastAction=documents.filter(d=>selected.has(d.id)).map(d=>({id:d.id,archived:Boolean(d.archived)}));documents.forEach(d=>{if(selected.has(d.id))d.archived=archive;});$('message').textContent=`${selected.size} document${selected.size===1?'':'s'} ${archive?'archived':'restored'}.`;selected.clear();$('undo').hidden=false;render();$('undo').focus();});
$('undo').addEventListener('click',()=>{if(!lastAction)return;for(const previous of lastAction)documents.find(d=>d.id===previous.id).archived=previous.archived;lastAction=null;$('message').textContent='Action undone.';$('undo').hidden=true;render();$('view').focus();});
const preference=matchMedia('(prefers-color-scheme: dark)');function theme(dark){document.documentElement.classList.toggle('dark',dark);$('theme').setAttribute('aria-pressed',String(dark));$('theme').textContent=dark?'Light mode':'Dark mode';}theme(preference.matches);let chosen=false;preference.addEventListener('change',event=>{if(!chosen)theme(event.matches);});$('theme').addEventListener('click',()=>{chosen=true;theme(!document.documentElement.classList.contains('dark'));});render();
</script>
</body>
</html>
