<!doctype html>
<html lang="en-US" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal finances · Folio</title>
<link rel="stylesheet" href="../../../skills/editorial-calm/assets/tokens.css">
<link rel="stylesheet" href="../../../skills/editorial-calm/assets/fonts.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);font:var(--type-weightBody) var(--type-bodyWeb)/var(--type-lineHeight) system-ui,sans-serif}
.shell{max-width:896px;margin-inline:auto;padding-inline:var(--space-gutterWeb)}
header{padding-block:24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px}
.brand{font-size:20px;font-weight:600;letter-spacing:-.5px}
.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:end}
.control{display:flex;flex-direction:column;gap:6px;min-width:0}
label{font-weight:500;font-size:14px}
select{font:inherit;min-height:44px;max-width:100%;padding:8px 12px;border:1px solid var(--input);border-radius:var(--radius-control);background:var(--background);color:var(--foreground)}
:focus-visible{outline:2px solid var(--ring);outline-offset:4px}
main{padding-block:40px 56px}
h1{font-size:var(--type-pageTitle);line-height:1.2;letter-spacing:-.8px;font-weight:600;margin:0 0 12px}
h2{font-size:var(--type-section);font-weight:600;margin:0}
p{margin:4px 0;max-width:55ch}
.muted,dt,.meta{color:var(--muted-foreground)}
.meta{font-size:14px}
section{margin-block-start:var(--space-sectionGap);padding-block-start:var(--space-sectionInset);border-top:1px solid var(--border)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:28px 0 0}
dt{font-size:14px;font-weight:500}
dd{margin:8px 0 0;font-size:28px;line-height:1.3;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
bdi{font-variant-numeric:tabular-nums;white-space:nowrap}
.section-head{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:20px;margin-block-end:20px}
.rows{list-style:none;padding:0;margin:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,auto);gap:24px;padding-block:20px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
h3{font-size:var(--type-rowTitle);font-weight:600;line-height:1.5;margin:0;overflow-wrap:anywhere;hyphens:auto}
.amounts{text-align:end;font-variant-numeric:tabular-nums}
.amount{font-size:20px;font-weight:600}
.warning{color:var(--warning-text);font-size:14px;margin-block-start:8px}
.status{color:var(--muted-foreground);font-size:14px;min-height:1.625em;margin-block:12px 0}
footer{border-top:1px solid var(--border);padding-block:24px 40px;color:var(--muted-foreground);font-size:14px}
@media(max-width:600px){.summary{grid-template-columns:1fr;gap:20px}.summary>div{display:flex;flex-direction:column;align-items:start;gap:4px}.summary dt{max-width:none}dd{font-size:24px;text-align:start}.row{grid-template-columns:1fr;gap:12px}.amounts{text-align:start}.controls{width:100%}.controls .control{flex:1 1 100%}.section-head .control{width:100%}.section-head select{width:100%}header{align-items:start}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="shell">
<header><span class="brand">Folio</span><div class="controls">
<div class="control"><label id="locale-label" for="locale">Language & region</label><select id="locale"><option value="en-US" lang="en">English · US</option><option value="de-DE" lang="de">Deutsch · DE</option><option value="ar" lang="ar" dir="rtl">العربية</option></select></div>
<div class="control"><label id="theme-label" for="theme">Appearance</label><select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
</div></header>
<main>
<h1 id="title"></h1><p id="intro" class="muted"></p><p id="period" class="meta"></p>
<dl class="summary"><div><dt id="net-label"></dt><dd id="net"></dd></div><div><dt id="assets-label"></dt><dd id="assets"></dd></div><div><dt id="debt-label"></dt><dd id="debt"></dd></div></dl>
<section aria-labelledby="accounts-title">
<div class="section-head"><div><h2 id="accounts-title"></h2><p id="comparison" class="meta"></p></div><div class="control"><label id="filter-label" for="filter"></label><select id="filter"><option value="all"></option><option value="assets"></option><option value="debt"></option></select></div></div>
<p id="filter-status" class="status" role="status" aria-live="polite"></p><ul id="rows" class="rows"></ul>
</section>
</main><footer id="footer"></footer>
</div>
<script>
const $=id=>document.getElementById(id);
const copy={
'en-US':{title:'Personal finances',intro:'Your balances, with last month alongside.',period:'September 2026 · All balances in EUR',locale:'Language & region',theme:'Appearance',themes:['System','Light','Dark'],net:'Net balance',assets:'Positive balances',debt:'Outstanding debt',accounts:'Account comparison',comparison:'September compared with August 2026',filter:'Show accounts',filters:['All accounts','Positive balances','Negative balances'],previous:'Last month',change:'Change',negative:'Negative balance',warning:'Debt remains outstanding.',shown:'accounts shown. Totals include all accounts.',footer:'Example balances only. No bank connection or currency conversion.',names:['Everyday spending and household direct debits','Emergency savings for unexpected household expenses','Credit card for travel and recurring subscriptions','Long-term education and professional development savings']},
'de-DE':{title:'Persönliche Finanzen',intro:'Ihre Kontostände im Vergleich zum Vormonat.',period:'September 2026 · Alle Beträge in EUR',locale:'Sprache und Region',theme:'Darstellung',themes:['System','Hell','Dunkel'],net:'Gesamtsaldo',assets:'Positive Kontostände',debt:'Ausstehende Schulden',accounts:'Kontenvergleich',comparison:'September im Vergleich zu August 2026',filter:'Konten anzeigen',filters:['Alle Konten','Positive Kontostände','Negative Kontostände'],previous:'Vormonat',change:'Veränderung',negative:'Negativer Kontostand',warning:'Es bestehen weiterhin ausstehende Schulden.',shown:'Konten angezeigt. Die Summen umfassen alle Konten.',footer:'Nur Beispielbeträge. Keine Bankverbindung oder Währungsumrechnung.',names:['Girokonto für alltägliche Haushaltsausgaben und regelmäßige Lastschriften','Notfallrücklagen für unvorhergesehene Ausgaben im gemeinsamen Haushalt','Kreditkarte für Reisebuchungen und wiederkehrende Abonnementzahlungen','Langfristige Rücklagen für Weiterbildung und berufliche Qualifizierung']},
'ar':{title:'الشؤون المالية الشخصية',intro:'أرصدة حساباتك مع مقارنة بالشهر الماضي.',period:'سبتمبر ٢٠٢٦ · جميع الأرصدة باليورو',locale:'اللغة والمنطقة',theme:'المظهر',themes:['النظام','فاتح','داكن'],net:'صافي الرصيد',assets:'الأرصدة الموجبة',debt:'الديون المستحقة',accounts:'مقارنة الحسابات',comparison:'سبتمبر مقارنة بأغسطس ٢٠٢٦',filter:'عرض الحسابات',filters:['جميع الحسابات','الأرصدة الموجبة','الأرصدة السالبة'],previous:'الشهر الماضي',change:'التغير',negative:'رصيد سالب',warning:'لا تزال هناك ديون مستحقة.',shown:'حسابات معروضة. تشمل المجاميع جميع الحسابات.',footer:'أرصدة توضيحية فقط. لا يوجد اتصال بالبنك أو تحويل للعملات.',names:['حساب المصروفات اليومية للأسرة والمدفوعات الدورية المباشرة','مدخرات الطوارئ لتغطية النفقات المنزلية غير المتوقعة','بطاقة ائتمان لحجوزات السفر ومدفوعات الاشتراكات المتكررة','مدخرات طويلة الأجل للتعليم المستمر والتطوير المهني']}
};
const accounts=[{balance:2450.75,previous:2210.20},{balance:12800,previous:12500},{balance:-1840.65,previous:-2100.40},{balance:3650.50,previous:3500}];
let locale='en-US';
function money(value,signed=false){return new Intl.NumberFormat(locale,{style:'currency',currency:'EUR',signDisplay:signed?'exceptZero':'auto'}).format(value)}
function numberNode(value,signed=false){const node=document.createElement('bdi');node.dir=locale==='ar'?'rtl':'ltr';node.textContent=money(value,signed);return node}
function figure(id,value){$(id).replaceChildren(numberNode(value))}
function render(){
 const t=copy[locale];document.documentElement.lang=locale;document.documentElement.dir=locale==='ar'?'rtl':'ltr';document.title=t.title+' · Folio';
 for(const [id,key] of Object.entries({title:'title',intro:'intro',period:'period','locale-label':'locale','theme-label':'theme','net-label':'net','assets-label':'assets','debt-label':'debt','accounts-title':'accounts',comparison:'comparison','filter-label':'filter',footer:'footer'}))$(id).textContent=t[key];
 [...$('theme').options].forEach((option,i)=>option.textContent=t.themes[i]);[...$('filter').options].forEach((option,i)=>option.textContent=t.filters[i]);
 const positive=accounts.reduce((sum,a)=>sum+Math.max(0,a.balance),0),negative=accounts.reduce((sum,a)=>sum+Math.min(0,a.balance),0);
 figure('assets',positive);figure('debt',negative);figure('net',positive+negative);
 const visible=accounts.map((a,i)=>({...a,i})).filter(a=>$('filter').value==='all'||($('filter').value==='assets'?a.balance>=0:a.balance<0));
 $('rows').replaceChildren();
 for(const a of visible){
  const row=document.createElement('li');row.className='row';
  const details=document.createElement('div'),heading=document.createElement('h3');heading.textContent=t.names[a.i];details.append(heading);
  if(a.balance<0){const warning=document.createElement('p');warning.className='warning';warning.textContent=t.negative+'. '+t.warning;details.append(warning)}
  const amounts=document.createElement('div');amounts.className='amounts';
  const current=document.createElement('div');current.className='amount';current.append(numberNode(a.balance));
  const previous=document.createElement('p');previous.className='meta';previous.append(t.previous+' ',numberNode(a.previous));
  const change=document.createElement('p');change.className='meta';change.append(t.change+' ',numberNode(a.balance-a.previous,true));
  amounts.append(current,previous,change);row.append(details,amounts);$('rows').append(row);
 }
 $('filter-status').textContent=new Intl.NumberFormat(locale).format(visible.length)+' '+t.shown;
}
const media=matchMedia('(prefers-color-scheme: dark)');
function theme(){document.documentElement.classList.toggle('dark',$('theme').value==='dark'||$('theme').value==='system'&&media.matches)}
$('locale').addEventListener('change',()=>{locale=$('locale').value;render()});
$('filter').addEventListener('change',render);$('theme').addEventListener('change',theme);media.addEventListener('change',theme);
render();theme();
</script>
</body>
</html>
